<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funguo — Seller dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <div id="boot" class="boot" role="status" aria-label="Loading Funguo">
    <div class="boot-inner">
      <div class="boot-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0c1829"/><circle cx="12.5" cy="15" r="4.1" fill="none" stroke="#d4af37" stroke-width="1.8"/><path d="M16.2 15H24.2M20.6 15v3.1M24.2 15v2.2" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <p class="boot-word">Funguo</p>
      <p class="boot-sub">Escrow on PayPal</p>
    </div>
  </div>
  <a class="skip" href="#main">Skip to content</a>
  <div id="hdr"></div>
  <main id="main" class="page">
    <p class="eyebrow">Seller</p>
    <h1 class="page-title">Your shop</h1>
    <p class="page-lead">Describe what the buyer is paying for, then send the link on WhatsApp or email. They create an account from that link and choose PayPal Checkout or Pal-Lock.</p>
    <div class="toolbar">
      <a class="btn btn-line" id="complain" href="/support?role=seller">File a complaint</a>
    </div>
    <div id="board"><p class="meta" style="margin-top:18px">Loading shop…</p></div>
  </main>
<script>
const { $, api, esc, money, persona, orderLink, ticketLink, riskBadge, toast, header } = F;
let pendingShare = null;
let shopId = '';

function inviteText(url, title, price) {
  return `Please pay for ${title} (${price}) on Funguo. You can pay with PayPal Checkout, or use Pal-Lock so the money stays locked until you confirm the item.\n${url}`;
}
function waDigits(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d.startsWith('0')) d = `254${d.slice(1)}`;
  return d;
}

function hint(o) {
  if (o.state === 'HELD') return 'Ready to ship';
  if (o.state === 'SHIPPED') return 'In transit';
  if (o.state === 'DISPUTED') return 'Buyer opened a dispute';
  return '';
}

function socialRow(a) {
  const checked = a.status === 'verified';
  return `<article class="social">
    <div class="social-top"><b>${esc(a.label)}</b> <span class="meta">@${esc(a.handle)}</span> ${checked ? '<span class="ok">checked</span>' : '<span class="warn">not checked yet</span>'}</div>
    ${checked ? `<a class="social-link" href="${esc(a.profile_url)}" target="_blank" rel="noopener">${esc(a.profile_url)}</a>` : `<p class="meta" style="margin:0">Put <b>${esc(a.code)}</b> in the bio or a public post, then check.</p>`}
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${checked ? '' : `<button type="button" class="btn btn-line" data-check="${esc(a.id)}">Check ${esc(a.label)}</button>`}
      <button type="button" class="btn btn-line" data-remove="${esc(a.id)}">Remove</button>
    </div>
  </article>`;
}

function listingCard(l) {
  const v = l.verification;
  return `<article class="card listing">
    <div class="listing-visual">${l.image_url ? `<img src="${esc(l.image_url)}" alt="" />` : ''}</div>
    <div class="listing-body">
      <div class="listing-top"><h3>${esc(l.title)}</h3><span class="price">${money(l.price, l.currency)}</span></div>
      <div class="flags">${riskBadge(v)}</div>
      <div class="listing-actions">
        <button type="button" class="btn btn-navy" data-invite="${esc(l.id)}" data-title="${esc(l.title)}" data-price="${esc(money(l.price, l.currency))}">Send invite</button>
        <a class="btn btn-line" href="/l/${l.id}">View</a>
      </div>
    </div>
  </article>`;
}

function idSlot(kind, label, onFile) {
  return `<label class="lbl">${esc(label)} ${onFile ? '<span class="ok">on file</span>' : ''}
    ${onFile ? `<img class="id-preview" alt="" src="/api/seller/identity/${kind}" />` : ''}
    <input name="${kind}" type="file" accept="image/png,image/jpeg,image/webp,image/gif" ${onFile ? '' : 'required'} class="field" />
  </label>`;
}

function render(data) {
  const s = data.seller;
  const n = data.stats;
  const id = s.identity || { id_front: false, id_back: false, face: false, complete: false };
  const trustDone = [!!s.photo_url, (s.socials || []).some((x) => x.status === 'verified'), !!id.complete].filter(Boolean).length;
  $('#complain').href = `/support?role=seller&seller=${encodeURIComponent(s.id)}`;
  $('#board').innerHTML = `
    <p class="meta" style="margin-top:10px">${esc(s.name)} · ${s.verified ? 'verified' : 'unverified'} · ${s.total_orders} orders · ${s.total_disputes} disputes</p>
    <section id="share" class="card card-pad stack section-gap" ${pendingShare ? '' : 'hidden'}>
      <h2>Send the payment invite</h2>
      <p class="meta" id="shareFor" style="margin:0">${pendingShare ? `${esc(pendingShare.title)} · ${esc(pendingShare.price)}` : ''}</p>
      <label class="lbl">Invite link
        <input id="shareLink" class="field" readonly value="${pendingShare ? esc(pendingShare.invite_url) : ''}" />
      </label>
      <div class="pair">
        <label class="lbl">Buyer email
          <input id="shareEmail" type="email" class="field" placeholder="buyer@email.com" />
        </label>
        <label class="lbl">Buyer WhatsApp
          <input id="sharePhone" class="field" inputmode="tel" placeholder="2547…" />
        </label>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" class="btn btn-line" id="copyInvite">Copy link</button>
        <button type="button" class="btn btn-primary" id="sendEmail">Open email</button>
        <button type="button" class="btn btn-navy" id="sendWa">Open WhatsApp</button>
      </div>
      <p class="fine">WhatsApp and email open on your own phone or mail app with the message ready. You tap send. Funguo does not message the buyer by itself.</p>
    </section>
    <section class="stats" aria-label="Seller summary">
      <article class="card stat"><span>Listings</span><strong>${n.listings}</strong></article>
      <article class="card stat"><span>Orders</span><strong>${n.orders}</strong></article>
      <article class="card stat"><span>On hold</span><strong>${money(n.held, n.currency)}</strong></article>
      <article class="card stat"><span>Released</span><strong>${money(n.released, n.currency)}</strong></article>
    </section>
    <div class="dash-grid">
      <form id="newListing" class="card card-pad stack">
        <h2>Request a payment</h2>
        <input type="hidden" name="seller_id" value="${esc(s.id)}" />
        <label class="lbl">Title
          <input name="title" required class="field" placeholder="What are you selling?" />
        </label>
        <label class="lbl">Description
          <textarea name="description" required rows="3" class="field" placeholder="Condition and what is included"></textarea>
        </label>
        <div class="pair">
          <label class="lbl">Price (${esc(s.currency_label || 'USD')})
            <input name="price" type="number" step="0.01" min="1" required class="field" />
          </label>
          <label class="lbl">Image URL <span class="opt">optional</span>
            <input name="image_url" class="field" placeholder="https://…" />
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create payment request</button>
        <div id="created"></div>
      </form>
      <section class="stack">
        <h2 class="section-title">Orders</h2>
        <div class="card">${data.orders.map((o) => orderLink(o, hint(o))).join('') || '<p class="empty">No orders on this shop yet.</p>'}</div>
      </section>
    </div>
    <details class="card card-pad trust section-gap" data-key="trust">
      <summary>
        <span><b>Build buyer trust</b> <span class="meta">· ${trustDone} of 3 done</span></span>
        <span class="trust-checks">
          <span class="${s.photo_url ? 'ok' : 'todo'}">Photo</span>
          <span class="${(s.socials || []).some((x) => x.status === 'verified') ? 'ok' : 'todo'}">Verified social</span>
          <span class="${id.complete ? 'ok' : 'todo'}">ID on file</span>
        </span>
      </summary>
      <p class="meta">Buyers are more willing to pay a seller with a face, a checked Instagram or TikTok account, and ID held by the audit desk.</p>
    <section class="stack trust-part">
      <h3>Your photo and social accounts</h3>
      <p class="meta" style="margin:0">Buyers see your photo, and a social account only after its code is on that public profile.</p>
      <div class="who">
        ${s.photo_url ? `<img class="avatar" alt="" src="${esc(s.photo_url)}" />` : '<div class="avatar" aria-hidden="true"></div>'}
        <form id="photoForm" class="stack">
          <label class="lbl">Photo
            <input name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required class="field" />
          </label>
          <button class="btn btn-navy" type="submit">Save photo</button>
        </form>
      </div>
      <form id="socialForm" class="stack">
        <div class="pair">
          <label class="lbl">Account
            <select name="platform" class="field">
              <option value="instagram">Instagram</option>
              <option value="tiktok">TikTok</option>
              <option value="facebook">Facebook</option>
              <option value="x">X</option>
              <option value="youtube">YouTube</option>
            </select>
          </label>
          <label class="lbl">Username
            <input name="handle" required class="field" placeholder="@yourname or profile link" />
          </label>
        </div>
        <button class="btn btn-primary" type="submit">Add account</button>
      </form>
      <div class="stack">${(s.socials || []).map(socialRow).join('') || '<p class="meta" style="margin:0">No accounts yet.</p>'}</div>
    </section>
    <section class="stack trust-part">
      <h3>Identity documents</h3>
      <p class="meta" style="margin:0">Upload the front and back of your ID card, and a photo of your face. Buyers never see these. The audit desk keeps them so a stolen payment or a scam can be reported with the person who took it.</p>
      <p style="margin:0">${id.complete ? '<span class="ok">All three are on file</span>' : '<span class="warn">Front, back, and face are still needed</span>'}</p>
      <form id="idForm" class="stack">
        <div class="id-grid">
          ${idSlot('id_front', 'ID card, front', id.id_front)}
          ${idSlot('id_back', 'ID card, back', id.id_back)}
          ${idSlot('face', 'Photo of your face', id.face)}
        </div>
        <button class="btn btn-primary" type="submit">Save identity documents</button>
      </form>
    </section>
    </details>
    <section class="stack section-gap">
      <h2 class="section-title">Listings</h2>
      <div class="listings">${data.listings.map(listingCard).join('') || '<p class="empty">No listings yet.</p>'}</div>
    </section>
    <section class="stack section-gap">
      <h2 class="section-title">Complaints</h2>
      <div class="card">${data.tickets.map(ticketLink).join('') || '<p class="empty">No support tickets for this shop.</p>'}</div>
    </section>`;

  $('#newListing').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Verifying listing…';
    try {
      const l = await api('/api/listings', { json: Object.fromEntries(new FormData(e.target)) });
      const invite = await api('/api/invites', { json: { listing_id: l.id, channel: 'link' } });
      pendingShare = { ...invite, title: l.title, price: money(l.price, l.currency), listing_id: l.id };
      toast('Payment request is ready to send', 'info');
      await load(s.id);
    } catch (err) { toast(err.message); }
    finally { btn.disabled = false; btn.textContent = 'Create payment request'; }
  });
  wireShare();
  wireIdentity();
}

function wireIdentity() {
  $('#photoForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const file = e.target.photo.files?.[0];
    if (!file) return toast('Choose a photo');
    btn.disabled = true;
    try {
      const body = new FormData();
      body.set('photo', file);
      const res = await fetch('/api/seller/photo', { method: 'POST', body });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      toast('Photo saved', 'info');
      await load(shopId);
    } catch (err) { toast(err.message); btn.disabled = false; }
  });
  $('#socialForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      await api('/api/seller/socials', { json: Object.fromEntries(new FormData(e.target)) });
      toast('Account added. Put the code on that profile, then check it.', 'info');
      await load(shopId);
    } catch (err) { toast(err.message); btn.disabled = false; }
  });
  document.querySelectorAll('[data-check]').forEach((btn) => btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await api(`/api/seller/socials/${btn.dataset.check}/check`, { json: {} });
      toast('That account is checked', 'info');
      await load(shopId);
    } catch (err) { toast(err.message); btn.disabled = false; }
  }));
  $('#idForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const body = new FormData();
    for (const name of ['id_front', 'id_back', 'face']) {
      const file = e.target.elements[name]?.files?.[0];
      if (file) body.append(name, file);
    }
    if (![...body.keys()].length) return toast('Add the front of the ID, the back, and a photo of your face');
    btn.disabled = true;
    try {
      const res = await fetch('/api/seller/identity', { method: 'POST', body });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      toast(data.identity?.complete ? 'Identity documents saved' : 'Saved. Add the remaining photos.', 'info');
      await load(shopId);
    } catch (err) { toast(err.message); btn.disabled = false; }
  });
  document.querySelectorAll('[data-remove]').forEach((btn) => btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await api(`/api/seller/socials/${btn.dataset.remove}`, { method: 'DELETE' });
      await load(shopId);
    } catch (err) { toast(err.message); btn.disabled = false; }
  }));
}

function wireShare() {
  document.querySelectorAll('[data-invite]').forEach((btn) => btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const invite = await api('/api/invites', { json: { listing_id: btn.dataset.invite, channel: 'link' } });
      pendingShare = { ...invite, title: btn.dataset.title, price: btn.dataset.price, listing_id: btn.dataset.invite };
      await load(shopId);
      $('#share')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) { toast(err.message); btn.disabled = false; }
  }));
  $('#copyInvite')?.addEventListener('click', async () => {
    await navigator.clipboard?.writeText($('#shareLink').value).catch(() => {});
    toast('Invite link copied', 'info');
  });
  $('#sendEmail')?.addEventListener('click', async () => {
    const email = $('#shareEmail').value.trim();
    if (!email) return toast('Enter the buyer email');
    try {
      const invite = await api('/api/invites', { json: { listing_id: pendingShare.listing_id, channel: 'email', recipient_email: email } });
      const text = inviteText(invite.invite_url, pendingShare.title, pendingShare.price);
      location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent('Payment request on Funguo')}&body=${encodeURIComponent(text)}`;
      toast('Email draft opened. The request will show on their dashboard after they sign up with this email.', 'info');
    } catch (err) { toast(err.message); }
  });
  $('#sendWa')?.addEventListener('click', async () => {
    const phone = waDigits($('#sharePhone').value);
    if (phone.length < 8) return toast('Enter the buyer WhatsApp number with country code');
    try {
      const invite = await api('/api/invites', { json: { listing_id: pendingShare.listing_id, channel: 'whatsapp', recipient_phone: phone } });
      const text = inviteText(invite.invite_url, pendingShare.title, pendingShare.price);
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
    } catch (err) { toast(err.message); }
  });
}

async function load(id) {
  shopId = id;
  persona.setSeller(id);
  render(await api(`/api/dashboard/seller?seller_id=${encodeURIComponent(id)}`));
}

(async () => {
  const session = await header();
  const id = session?.user?.seller_id;
  if (!id) {
    $('#board').innerHTML = '<p class="callout callout-bad">This account is not a seller shop.</p>';
    return;
  }
  await load(id);
})().catch((e) => toast(e.message));
</script>
</body>
</html>
