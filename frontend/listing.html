<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funguo — Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <div id="boot" class="boot" role="status" aria-label="Loading Funguo">
    <div class="boot-inner">
      <div class="boot-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0c1829"/><circle cx="12.5" cy="15" r="4.1" fill="none" stroke="#d4af37" stroke-width="1.8"/><path d="M16.2 15H24.2M20.6 15v3.1M24.2 15v2.2" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <p class="boot-word">Funguo</p>
      <p class="boot-sub">Escrow on PayPal</p>
    </div>
  </div>
  <a class="skip" href="#main">Skip to content</a>
  <div id="hdr"></div>
  <main class="page" id="main"><p class="meta">Loading…</p></main>
<script>
const { $, api, esc, money, riskBadge, toast, header, socialLinks, communityFlags } = F;
const id = location.pathname.split('/').pop();

function verificationPanel(v) {
  if (!v) return '';
  const ref = v.reference;
  return `<section class="card card-pad stack">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2>Listing check</h2>${riskBadge(v)}</div>
    ${ref?.price_stats ? `<p class="meta">Market reference (${esc(ref.source)}): ${money(ref.price_stats.min)}–${money(ref.price_stats.max)}, median ${money(ref.price_stats.median)}</p>` : ''}
    ${(v.flags || []).length ? `<ul class="meta" style="margin:0;padding-left:18px;color:var(--ink)">${v.flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '<p class="meta">No red flags found.</p>'}
  </section>`;
}

(async () => {
  const session = await header();
  const me = session?.user || null;
  const l = await api(`/api/listings/${id}`);
  document.title = `Funguo — ${l.title}`;
  const s = l.seller;
  const cancelled = new URLSearchParams(location.search).has('cancelled');
  $('#main').innerHTML = `
    ${cancelled ? '<div class="callout callout-warn" style="margin-bottom:16px">PayPal approval was cancelled. No hold was placed.</div>' : ''}
    <div class="product">
      <div class="stack-lg">
        ${l.image_url ? `<img src="${esc(l.image_url)}" class="shot" alt="" />` : '<div class="shot"></div>'}
        ${verificationPanel(l.verification)}
      </div>
      <div class="stack-lg">
        <div>
          <p class="eyebrow">Checkout</p>
          <h1>${esc(l.title)}</h1>
          <div class="amount">${money(l.price, l.currency)}</div>
          <p class="desc">${esc(l.description)}</p>
        </div>
        <section class="card card-pad">
          <div class="who">
            ${s.photo_url ? `<img class="avatar" alt="" src="${esc(s.photo_url)}" />` : ''}
            <div>
              <div class="seller-name">${esc(s.name)} ${s.verified ? '<span class="ok">verified</span>' : '<span class="warn">unverified</span>'}</div>
              <p class="meta" style="margin:6px 0 0">${s.total_orders} orders · ${s.total_disputes} disputes · member since ${new Date(s.member_since).toLocaleDateString()}</p>
              ${socialLinks(s)}
              ${communityFlags(s)}
            </div>
          </div>
        </section>
        ${me?.role === 'seller' ? `<section class="card card-pad stack"><h2>This is your payment request</h2><p class="meta" style="margin:0">Send it from your dashboard. The buyer creates an account from the link, then chooses PayPal Checkout or Pal-Lock.</p><a class="btn btn-primary" href="/seller">Back to dashboard</a></section>` : me?.role === 'buyer' ? `<form id="buy" class="card card-pad checkout stack">
          <div class="checkout-kicker">Paying as ${esc(me.name)}</div>
          ${(l.verification?.risk === 'high' || (s.socials || []).some((a) => a.reports > 0)) ? '<p class="callout callout-warn">This shop has reports on the community list. Pal-Lock keeps your money locked until you confirm the item.</p>' : ''}
          <input type="hidden" name="buyer_name" value="${esc(me.name)}" />
          <input type="hidden" name="buyer_email" value="${esc(me.email)}" />
          <div class="pay-stack">
            <button type="button" data-option="checkout" data-method="paypal" class="btn btn-paypal"><span class="pay-word">PayPal</span> Checkout</button>
            <button type="button" data-option="pal_lock" data-method="paypal" class="btn btn-paypal"><span class="pay-word">Pal-Lock</span></button>
          </div>
          <p class="fine">Checkout pays ${esc(s.name)} now. Pal-Lock locks ${money(l.price, l.currency)} until you confirm the item, or a dispute decides.</p>
          <button type="button" data-option="pal_lock" data-method="card" class="btn btn-line btn-block">Place the Pal-Lock with a sandbox card</button>
        </form>` : `<section class="card card-pad stack">
          <h2>Create a buyer account to pay</h2>
          <p class="meta" style="margin:0">The hold is tied to your account, so the seller can see who paid and you can confirm the item later.</p>
          <a class="btn btn-primary" href="/signup?role=buyer&next=${encodeURIComponent(location.pathname)}">Create account</a>
          <a class="btn btn-line" href="/login?next=${encodeURIComponent(location.pathname)}">I already have an account</a>
        </section>`}
      </div>
    </div>`;

  $('#buy')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    const method = btn?.dataset?.method;
    const option = btn?.dataset?.option;
    if (!method || !option) return;
    e.preventDefault();
    const btns = [...e.currentTarget.querySelectorAll('button')];
    const label = btn.innerHTML;
    btns.forEach((b) => (b.disabled = true));
    btn.textContent = 'Contacting PayPal…';
    try {
      const fd = Object.fromEntries(new FormData($('#buy')));
      if (fd.buyer_email) F.persona.setBuyer(fd.buyer_email, fd.buyer_name);
      const v = await api('/api/orders', { json: { listing_id: id, ...fd, payment_method: method, option } });
      if (v.order.state === 'INITIATED' && v.order.approval_url) location.href = v.order.approval_url;
      else location.href = `/o/${v.order.id}`;
    } catch (err) {
      toast(err.message);
      btns.forEach((b) => (b.disabled = false));
      btn.innerHTML = label;
    }
  });
})().catch((e) => { $('#main').innerHTML = `<p class="callout callout-bad">${esc(e.message)}</p>`; });
</script>
</body>
</html>
