<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funguo — Payment invite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <div id="hdr"></div>
  <main id="main" class="page"><p class="meta">Loading the payment request…</p></main>
<script>
const { $, api, esc, money, toast, header, socialLinks, communityFlags } = F;
const id = location.pathname.split('/').filter(Boolean).pop();

header().then(async (session) => {
  const invite = await api(`/api/invites/${id}`);
  const me = session?.user;
  document.title = `Funguo — ${invite.title}`;
  const next = encodeURIComponent(location.pathname);
  let action = '';
  if (me?.role === 'buyer') {
    action = `<a class="btn btn-primary btn-block" href="/l/${esc(invite.listing_id)}">Continue as ${esc(me.name)} and choose how to pay</a>`;
  } else if (me?.role === 'seller') {
    action = `<p class="meta">You are signed in as a seller. The buyer should open this link and create a buyer account.</p><a class="btn btn-line" href="/seller">Seller dashboard</a>`;
  } else {
    action = `<a class="btn btn-primary btn-block" href="/signup?role=buyer&next=${next}">Create a buyer account</a>
      <a class="btn btn-line btn-block" href="/login?next=${next}">I already have an account</a>`;
  }
  $('#main').innerHTML = `
    <p class="eyebrow">Payment invite</p>
    <div class="product">
      <div>${invite.image_url ? `<img class="shot" alt="" src="${esc(invite.image_url)}" />` : '<div class="shot"></div>'}</div>
      <div class="stack-lg">
        <div>
          <h1 class="page-title">${esc(invite.title)}</h1>
          <div class="amount">${money(invite.price, invite.currency)}</div>
          <p class="desc">${esc(invite.description)}</p>
        </div>
        <section class="card card-pad">
          <div class="who">
            ${invite.seller?.photo_url ? `<img class="avatar" alt="" src="${esc(invite.seller.photo_url)}" />` : ''}
            <div>
              <div class="seller-name">${esc(invite.seller_name)}</div>
              <p class="meta" style="margin:6px 0 0">asked you to pay into escrow. The money stays on hold until you confirm the item.</p>
              ${socialLinks(invite.seller)}
              ${communityFlags(invite.seller)}
            </div>
          </div>
        </section>
        <section class="card card-pad stack">${action}</section>
      </div>
    </div>`;
}).catch((e) => { $('#main').innerHTML = `<p class="callout callout-bad">${esc(e.message)}</p>`; toast(e.message); });
</script>
</body>
</html>
