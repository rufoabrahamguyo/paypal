<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funguo — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <div id="hdr"></div>
  <main class="auth-wrap">
    <form id="signup" class="card auth-card stack">
      <p class="eyebrow">Account</p>
      <h1>Create an account</h1>
      <p class="meta" style="margin:0">Sellers request payment. Buyers pay from an invite. Pick the one you are.</p>
      <label class="lbl">I am
        <select name="role" id="role" class="field">
          <option value="seller">Selling — I want to be paid</option>
          <option value="buyer">Buying — I was sent a link</option>
        </select>
      </label>
      <label class="lbl">Country
        <select name="country" id="country" required class="field">
          <option value="" selected disabled>Choose your country</option>
        </select>
      </label>
      <p class="meta" style="margin:0">Prices on your account use this country's currency. Kenya is KSh.</p>
      <label class="lbl">Name
        <input name="name" required autocomplete="name" class="field" />
      </label>
      <label class="lbl">Email
        <input name="email" type="email" required autocomplete="username" class="field" />
      </label>
      <label class="lbl">Password
        <input name="password" type="password" required minlength="8" autocomplete="new-password" class="field" />
      </label>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
      <p class="meta" style="margin:0">Already registered? <a id="login" href="/login">Sign in</a></p>
    </form>
  </main>
<script>
const { $, api, toast, header } = F;
const q = new URLSearchParams(location.search);
const next = q.get('next') || '';
if (q.get('role') === 'buyer' || q.get('role') === 'seller') $('#role').value = q.get('role');
if (next.startsWith('/') && !next.startsWith('//')) $('#login').href = `/login?next=${encodeURIComponent(next)}`;
header();
(async () => {
  try {
    const countries = await api('/api/countries');
    const sel = $('#country');
    for (const c of countries) {
      const opt = document.createElement('option');
      opt.value = c.code;
      opt.textContent = `${c.name} — ${c.label}`;
      sel.append(opt);
    }
  } catch (err) { toast(err.message); }
})();
$('#signup').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const body = Object.fromEntries(new FormData(e.target));
    if (next.startsWith('/') && !next.startsWith('//')) body.next = next;
    const res = await api('/api/auth/signup', { json: body });
    location.href = res.next || '/';
  } catch (err) { toast(err.message); btn.disabled = false; }
});
</script>
</body>
</html>
