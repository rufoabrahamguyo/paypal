<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abode — Shopping cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <header class="shop-bar">
    <strong>ABODE</strong>
    <a href="/developers">Payments by Funguo</a>
  </header>
  <main id="main" class="shop-grid"></main>
  <p class="shop-foot">Abode is a sample shop with its own cart. Pal-Lock is a Funguo button next to PayPal Checkout. People selling from TikTok or WhatsApp still use <a href="/">the Funguo link</a>.</p>
<script>
const { $, api, esc, money, toast } = F;
const params = new URLSearchParams(location.search);
const done = location.pathname.startsWith('/shop/done');
let qty = 1;

function cart() {
  const total = qty * 200;
  const cancelled = params.has('cancelled');
  $('#main').innerHTML = `
    ${cancelled ? '<div class="callout callout-warn" style="grid-column:1/-1">Payment cancelled. Nothing was charged.</div>' : ''}
    <section>
      <p class="eyebrow">Shopping cart</p>
      <h1 class="page-title">Your chair</h1>
      <article class="card card-pad shop-item">
        <div class="shop-thumb" role="img" aria-label="Oak chair"></div>
        <div>
          <h2 style="margin:0">Modern Oak Cushion Chair</h2>
          <p class="meta" style="margin:4px 0 0">${money(200)} each</p>
          <div class="qty">
            <button type="button" id="minus" aria-label="Fewer">−</button>
            <b id="qty">${qty}</b>
            <button type="button" id="plus" aria-label="More">+</button>
          </div>
        </div>
      </article>
    </section>
    <section class="card card-pad shop-sum">
      <h2>Order summary</h2>
      <div class="shop-line"><span>Subtotal</span><span>${money(total)}</span></div>
      <div class="shop-line"><span>Shipping</span><span>FREE</span></div>
      <div class="shop-line shop-total"><span>Est. total</span><span>${money(total)}</span></div>
      <div class="pay-stack" style="margin-top:8px">
        <button type="button" data-option="checkout" class="btn btn-paypal"><span class="pay-word">PayPal</span> Checkout</button>
        <button type="button" data-option="pal_lock" class="btn btn-paypal"><span class="pay-word">Pal-Lock</span></button>
      </div>
      <p class="fine">Checkout pays Abode now. Pal-Lock locks the same amount until you confirm the chair.</p>
    </section>`;
  $('#minus').onclick = () => { qty = Math.max(1, qty - 1); cart(); };
  $('#plus').onclick = () => { qty = Math.min(12, qty + 1); cart(); };
  document.querySelectorAll('[data-option]').forEach((btn) => btn.addEventListener('click', () => pay(btn)));
}

async function pay(btn) {
  const buttons = [...document.querySelectorAll('[data-option]')];
  buttons.forEach((b) => (b.disabled = true));
  const label = btn.innerHTML;
  btn.textContent = 'Contacting PayPal…';
  try {
    const v = await api('/api/shop/checkout', { json: { option: btn.dataset.option, quantity: qty } });
    if (v.payment.state === 'INITIATED' && v.payment.approval_url) location.href = v.payment.approval_url;
    else location.href = `/shop/done?payment=${v.payment.id}`;
  } catch (err) {
    toast(err.message);
    buttons.forEach((b) => (b.disabled = false));
    btn.innerHTML = label;
  }
}

function result(v) {
  const p = v.payment;
  const locked = p.option === 'pal_lock' && p.state === 'HELD';
  const paid = p.state === 'PAID' || p.state === 'RELEASED';
  const dropped = p.state === 'VOIDED';
  const headline = paid
    ? 'Abode has been paid'
    : dropped
      ? 'Pal-Lock was dropped'
      : locked
        ? 'Pal-Lock is holding the money'
        : esc(p.state);
  const detail = p.option === 'checkout'
    ? 'PayPal Checkout captured the payment. The seller already has it.'
    : paid
      ? 'You confirmed the chair. Pal-Lock released the hold to Abode.'
      : dropped
        ? 'The hold was cancelled. You were not charged.'
        : 'Abode does not have the money yet. Confirm the chair to release it, or drop the lock.';
  const events = (v.events || []).map((e) => `<li><b>${esc(e.type)}</b> <span class="meta">${e.delivered ? 'delivered to Abode' : 'not delivered'}</span></li>`).join('');
  const err = params.get('error');
  $('#main').innerHTML = `
    <section class="card card-pad stack" style="grid-column:1/-1">
      ${err ? `<div class="callout callout-bad">${esc(err)}</div>` : ''}
      <p class="eyebrow">${esc(v.app)} · ${esc(p.id)}</p>
      <h1 class="page-title">${headline}</h1>
      <p>${esc(p.description)} · ${money(p.amount, p.currency)}</p>
      <p class="meta" style="margin:0">${detail}</p>
      ${locked ? `<div class="pay-stack">
        <button type="button" id="release" class="btn btn-success">Confirm the chair and release ${money(p.amount, p.currency)}</button>
        <button type="button" id="drop" class="btn btn-line">Drop the Pal-Lock</button>
      </div>` : ''}
      <div>
        <div class="eyebrow">What Abode was told</div>
        <ul style="margin:8px 0 0;padding-left:18px">${events || '<li class="meta">No webhook yet.</li>'}</ul>
      </div>
      <a class="btn btn-line" href="/shop">Back to the cart</a>
    </section>`;
  $('#release')?.addEventListener('click', () => act('capture'));
  $('#drop')?.addEventListener('click', () => act('void'));
}

async function act(name) {
  try {
    result(await api(`/api/shop/payments/${params.get('payment')}/${name}`, { json: {} }));
  } catch (err) {
    toast(err.message);
  }
}

(async () => {
  if (!done) return cart();
  const id = params.get('payment');
  if (!id) return cart();
  try {
    result(await api(`/api/shop/payments/${id}`));
  } catch (err) {
    $('#main').innerHTML = `<p class="callout callout-bad">${esc(err.message)}</p>`;
  }
})();
</script>
</body>
</html>
