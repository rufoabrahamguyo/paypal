<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funguo — Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/theme.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <div id="boot" class="boot" role="status" aria-label="Loading Funguo">
    <div class="boot-inner">
      <div class="boot-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0c1829"/><circle cx="12.5" cy="15" r="4.1" fill="none" stroke="#d4af37" stroke-width="1.8"/><path d="M16.2 15H24.2M20.6 15v3.1M24.2 15v2.2" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <p class="boot-word">Funguo</p>
      <p class="boot-sub">Escrow on PayPal</p>
    </div>
  </div>
  <a class="skip" href="#main">Skip to content</a>
  <div id="hdr"></div>
  <main id="main" class="page">
    <p class="eyebrow">Admin</p>
    <h1 class="page-title">Audit trail</h1>
    <p class="page-lead">Every order transition, PayPal call, dispute decision, webhook, and support ticket. This demo view is open so the trail can be read without a separate login.</p>
    <div id="board"><p class="meta" style="margin-top:18px">Loading the trail…</p></div>
  </main>
<script>
const { $, api, esc, when, ticketBadge, toast, header } = F;
const KINDS = ['all', 'order', 'paypal', 'dispute', 'support', 'webhook'];
let data = null;
let kind = 'all';

function trailRows() {
  const rows = data.trail.filter((row) => kind === 'all' || row.kind === kind);
  if (!rows.length) return '<p class="empty">Nothing in this filter yet.</p>';
  return `<table class="data"><thead><tr><th>When</th><th>Kind</th><th>What happened</th><th>Actor</th></tr></thead><tbody>
    ${rows.map((row) => `<tr ${row.href ? `tabindex="0" data-href="${esc(row.href)}"` : ''}>
      <td class="meta">${when(row.at)}</td>
      <td><span class="badge b-slate">${esc(row.kind)}</span></td>
      <td><b>${esc(row.title || '')}</b><div class="meta">${esc(row.summary)}</div></td>
      <td class="meta">${esc(row.actor || '')}</td>
    </tr>`).join('')}
  </tbody></table>`;
}

function ticketCard(t) {
  return `<article class="card card-pad stack" data-ticket="${esc(t.id)}">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <div><h2>${esc(t.subject)}</h2><p class="meta" style="margin:4px 0 0">${esc(t.author_role)} · ${esc(t.author_email)} · ${esc(t.topic)}${t.order_id ? ` · ${esc(t.order_id)}` : ''}</p></div>
      ${ticketBadge(t.status)}
    </div>
    <p style="margin:0">${esc(t.body)}</p>
    <form class="stack reply">
      <label class="lbl">Support reply
        <textarea name="body" required rows="2" class="field" placeholder="What should the buyer or seller know?"></textarea>
      </label>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="btn btn-primary" type="submit">Send reply</button>
        <button class="btn btn-line" type="button" data-status="in_review">Mark in review</button>
        <button class="btn btn-success" type="button" data-status="resolved">Resolve</button>
      </div>
    </form>
    <a href="/support/${esc(t.id)}">Open the thread</a>
  </article>`;
}

function render() {
  const c = data.counts;
  $('#board').innerHTML = `
    <section class="stats" aria-label="Audit counts">
      <article class="card stat"><span>Orders</span><strong>${c.orders}</strong></article>
      <article class="card stat"><span>State changes</span><strong>${c.events}</strong></article>
      <article class="card stat"><span>PayPal calls</span><strong>${c.paypal_calls}</strong></article>
      <article class="card stat"><span>Open complaints</span><strong>${c.tickets_open}</strong></article>
    </section>
    <div class="filters" role="toolbar" aria-label="Filter the trail">
      ${KINDS.map((k) => `<button type="button" class="btn btn-line" data-kind="${k}" aria-pressed="${k === kind}">${k}</button>`).join('')}
    </div>
    <div class="card table-wrap">${trailRows()}</div>
    <section class="stack section-gap">
      <h2 class="section-title">Open complaints</h2>
      ${data.tickets.length ? data.tickets.map(ticketCard).join('') : '<div class="card"><p class="empty">No open complaints.</p></div>'}
    </section>`;
}

$('#board').addEventListener('click', async (e) => {
  const filter = e.target.closest('[data-kind]');
  if (filter) {
    kind = filter.dataset.kind;
    render();
    return;
  }
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('a, button, form')) location.href = row.dataset.href;
  const statusBtn = e.target.closest('[data-status]');
  if (!statusBtn) return;
  const card = statusBtn.closest('[data-ticket]');
  statusBtn.disabled = true;
  try {
    await api(`/api/support/${card.dataset.ticket}/status`, { json: { status: statusBtn.dataset.status } });
    toast('Ticket updated', 'info');
    data = await api('/api/admin/audit');
    render();
  } catch (err) { toast(err.message); statusBtn.disabled = false; }
});

$('#board').addEventListener('submit', async (e) => {
  const form = e.target.closest('form.reply');
  if (!form) return;
  e.preventDefault();
  const card = form.closest('[data-ticket]');
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    await api(`/api/support/${card.dataset.ticket}/replies`, { json: { author_role: 'support', body: new FormData(form).get('body') } });
    toast('Reply sent', 'info');
    data = await api('/api/admin/audit');
    render();
  } catch (err) { toast(err.message); btn.disabled = false; }
});

$('#board').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('tr[data-href]');
  if (!row) return;
  e.preventDefault();
  location.href = row.dataset.href;
});

header();
api('/api/admin/audit').then((d) => { data = d; render(); }).catch((e) => toast(e.message));
</script>
</body>
</html>
