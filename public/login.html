<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funguo — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/theme.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <div id="hdr"></div>
  <main class="auth-wrap">
    <form id="login" class="card auth-card stack">
      <p class="eyebrow">Account</p>
      <h1>Sign in</h1>
      <p class="meta" style="margin:0">Buyers, sellers, and the audit desk each land on their own dashboard.</p>
      <label class="lbl">Email
        <input name="email" type="email" required autocomplete="username" class="field" />
      </label>
      <label class="lbl">Password
        <input name="password" type="password" required autocomplete="current-password" class="field" />
      </label>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <p class="meta" style="margin:0">No account yet? <a id="signup" href="/signup">Create one</a></p>
      <p class="fine">Demo audit: admin@funguo.test / funguo-demo</p>
    </form>
  </main>
<script>
const { $, api, toast, header } = F;
const next = new URLSearchParams(location.search).get('next') || '';
if (next.startsWith('/') && !next.startsWith('//')) $('#signup').href = `/signup?next=${encodeURIComponent(next)}`;
header().then((session) => { if (session?.user) location.href = session.user.role === 'seller' ? '/seller' : session.user.role === 'admin' ? '/admin' : '/buyer'; });
$('#login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const body = Object.fromEntries(new FormData(e.target));
    if (next) body.next = next;
    const res = await api('/api/auth/login', { json: body });
    location.href = res.next || '/';
  } catch (err) { toast(err.message); btn.disabled = false; }
});
</script>
</body>
</html>
