<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funguo — Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/theme.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js"></script>
</head>
<body class="app">
  <div id="boot" class="boot" role="status" aria-label="Loading Funguo">
    <div class="boot-inner">
      <div class="boot-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0c1829"/><circle cx="12.5" cy="15" r="4.1" fill="none" stroke="#d4af37" stroke-width="1.8"/><path d="M16.2 15H24.2M20.6 15v3.1M24.2 15v2.2" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <p class="boot-word">Funguo</p>
      <p class="boot-sub">Escrow on PayPal</p>
    </div>
  </div>
  <a class="skip" href="#main">Skip to content</a>
  <div id="hdr"></div>
  <main class="page" id="main"><p class="meta">Loading…</p></main>
<script>
const { $, api, esc, money, when, badge, toast, header, json } = F;
const id = location.pathname.split('/').pop();
let pollTimer = null;
let openDetails = new Set();

const HAPPY = ['INITIATED', 'HELD', 'SHIPPED', 'INSPECTED', 'RELEASED'];
const DECISION_LABEL = {
  release_full: ['Released to seller', 'Full capture of the authorization', 'tone-release'],
  partial_refund: ['Partial refund', 'Captured a smaller amount with final_capture=true; the remainder of the hold returned to the buyer', 'tone-partial'],
  refund_full: ['Full refund', 'Authorization voided. The buyer is never charged', 'tone-refund'],
  escalate_to_human: ['Escalated to a human', 'No money moved. Funds stay on hold pending human review', 'tone-human'],
};

function stepper(o, events) {
  const visited = new Set(events.map((e) => e.to_state));
  const disputed = visited.has('DISPUTED');
  const path = disputed
    ? [...HAPPY.filter((s) => visited.has(s)), 'DISPUTED', o.state.startsWith('RESOLVED') ? o.state : 'RESOLVED_…']
    : HAPPY;
  return `<ol class="steps">${path.map((s, i) => {
    const done = visited.has(s); const cur = s === o.state;
    return `<li class="step ${cur ? 'is-current' : done ? 'is-done' : ''}">${esc(s)}</li>${i < path.length - 1 ? '<li class="step-arrow" aria-hidden="true">→</li>' : ''}`;
  }).join('')}</ol>`;
}

function idRow(label, value, mono = true) {
  return `<div><dt>${label}</dt><dd class="${mono ? 'mono' : ''}">${value ?? '—'}</dd></div>`;
}

function actionsPanel(o) {
  const a = o.allowed_actions;
  if (!a.length) return '';
  const parts = [];
  if (a.includes('approve')) parts.push(`<a href="${esc(o.approval_url)}" class="btn btn-paypal">Continue to PayPal approval</a>`);
  if (a.includes('ship')) parts.push(`<form id="shipForm" class="stack"><div class="eyebrow">Seller</div>
      <div class="pair" style="grid-template-columns: 1fr 2fr"><label class="lbl">Carrier<input name="carrier" value="DHL" class="field" /></label>
      <label class="lbl">Tracking<input name="tracking_number" required placeholder="Tracking number" value="JD0146${Math.floor(Math.random() * 1e8)}" class="field" /></label></div>
      <button class="btn btn-sky btn-block" type="submit">Mark shipped</button></form>`);
  if (a.includes('deliver')) parts.push(`<div class="stack"><div class="eyebrow">Carrier</div>
      <button type="button" data-act="deliver" class="btn btn-line btn-block">Mark delivered and open inspection</button></div>`);
  if (a.includes('confirm') || a.includes('dispute')) {
    parts.push(`<div class="stack"><div class="eyebrow">Buyer</div>
      ${a.includes('confirm') ? `<button type="button" data-act="confirm" class="btn btn-success btn-block">Confirm receipt and release ${money(o.amount)}</button>` : ''}
      ${a.includes('dispute') ? `<details class="dispute-open" ${openDetails.has('dispute') ? 'open' : ''} data-key="dispute">
        <summary>Something is wrong. Open a dispute</summary>
        <form id="disputeForm" class="stack" style="padding: 0 12px 12px">
          <label class="lbl">What arrived
            <textarea name="complaint" required rows="3" class="field" placeholder="Describe what arrived and how it differs from the listing"></textarea>
          </label>
          <label class="lbl">Photo of what arrived <span class="opt">JPEG, PNG, or WebP, up to 5MB</span>
            <input type="file" name="photo" accept="image/png,image/jpeg,image/webp,image/gif" class="field" /></label>
          <button class="btn btn-alert btn-block" type="submit">Submit to the dispute agent</button>
        </form></details>` : ''}</div>`);
  }
  return `<section class="card card-pad stack"><h2>Next steps</h2>${parts.join('')}</section>`;
}

function confidenceBar(c) {
  if (c == null) return '';
  const pct = Math.round(c * 100);
  return `<div class="meter"><span class="meter-label">Confidence</span>
    <div class="meter-track"><span class="${pct >= 70 ? '' : 'is-mid'}" style="width:${pct}%"></span></div>
    <b>${pct}%</b></div>`;
}

function disputeCard(d, o) {
  const photo = d.photo_path ? `<img src="/api/disputes/${d.id}/photo" alt="What the buyer received" style="width:112px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)" />` : '';
  const head = `<div style="display:flex;gap:12px">${photo}<div><div class="meta">Buyer complaint · ${when(d.created_at)}</div>
    <p class="quote">“${esc(d.complaint)}”</p></div></div>`;
  if (d.status === 'OPEN' || d.status === 'RUNNING') {
    return `<section class="card card-pad stack">${head}
      <div class="agent-live" role="status">
        <svg class="spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="3"/></svg>
        <div><b>The dispute agent is reading the evidence.</b>
        <p>Listing, photo, tracking, seller history, market prices, and scam patterns. This usually takes 20–60 seconds.</p></div></div></section>`;
  }
  const [title, sub, style] = DECISION_LABEL[d.decision] || ['Agent failed', d.error || '', 'tone-fail'];
  const f = d.findings || {};
  const human = d.status === 'ESCALATED' && o.state === 'DISPUTED';
  return `<section class="card card-pad stack ${style}" style="border-width:1px">
    ${head}
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline">
      <h3 style="margin:0;font-size:18px">${title}${d.decision === 'partial_refund' ? ` — ${money(d.refund_amount)} back to the buyer` : ''}</h3>
      <span class="meta">engine <b>${esc(d.engine)}</b> · ${when(d.decided_at)}</span>
    </div>
    <p class="meta">${esc(sub)}</p>
    ${confidenceBar(d.confidence)}
    <div><div class="eyebrow">Rationale</div>
      <p style="margin:6px 0 0;white-space:pre-line">${esc(d.rationale)}</p></div>
    ${f.evidence?.length ? `<div><div class="eyebrow">Evidence weighed</div>
      <ul style="margin:8px 0 0;padding-left:18px">${f.evidence.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
    ${f.guardrail ? `<div class="guard"><b>Guardrail.</b> ${esc(f.guardrail)}</div>` : ''}
    ${f.proposed_decision ? `<p class="meta">Proposed action before the guardrail: <b>${esc(f.proposed_decision)}</b>${f.proposed_refund_amount ? ` (${money(f.proposed_refund_amount)})` : ''}</p>` : ''}
    ${d.error ? `<p class="meta" style="color:var(--alert)">Error: ${esc(d.error)}</p>` : ''}
    ${human ? `<form id="humanForm" data-dispute="${d.id}" class="card card-pad stack">
      <h2>Human reviewer</h2>
      <div class="pair" style="grid-template-columns: 1fr 1.4fr 1fr">
        <button type="button" data-decision="release_full" class="btn btn-success">Release to seller</button>
        <div style="display:flex;gap:8px"><input name="refund_amount" type="number" step="0.01" placeholder="Refund USD" class="field" style="margin-top:0" />
          <button type="button" data-decision="partial_refund" class="btn btn-teal">Partial</button></div>
        <button type="button" data-decision="refund_full" class="btn btn-violet">Void hold</button>
      </div></form>` : ''}
    ${d.paypal_response ? `<details class="panel" data-key="pp-${d.id}" ${openDetails.has('pp-' + d.id) ? 'open' : ''}><summary>PayPal response</summary>${json(d.paypal_response)}</details>` : ''}
    <details class="panel" data-key="tx-${d.id}" data-transcript="${d.id}" ${openDetails.has('tx-' + d.id) ? 'open' : ''}><summary>Agent transcript (${d.transcript_steps} steps)</summary><div class="tx">Loading…</div></details>
  </section>`;
}

function render(v) {
  const { order: o, listing: l, seller: s, events, paypal_calls: calls, disputes } = v;
  document.title = `Funguo — ${o.id}`;
  const err = new URLSearchParams(location.search).get('error');
  $('#main').innerHTML = `
    ${err ? `<div class="callout callout-bad" style="margin-bottom:16px">${esc(err)}</div>` : ''}
    <div class="order-head">
      <div>
        <div class="kicker mono">${esc(o.id)} ${o.buyer_kind === 'agent' ? '<span class="badge b-indigo">bought by agent</span>' : ''}</div>
        <h1><a href="/l/${l.id}">${esc(l.title)}</a></h1>
        <p class="meta" style="margin:0">${money(o.amount, o.currency)} · seller ${esc(s.name)} · buyer ${esc(o.buyer_name || '—')}</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">${badge(o.state)}<a class="btn btn-line" href="/support?order=${esc(o.id)}">Contact support</a></div>
    </div>
    <div style="overflow-x:auto">${stepper(o, events)}</div>
    <div class="split">
      <div class="stack-lg">
        ${disputes.map((d) => disputeCard(d, o)).join('')}
        ${actionsPanel(o)}
        <section class="card card-pad">
          <h2>State history</h2>
          <ol class="timeline">${events.map((e) => `<li><span class="when">${when(e.created_at)}</span>
            <span>${e.from_state ? `${esc(e.from_state)} → ` : ''}<b>${esc(e.to_state)}</b> <span class="meta">· ${esc(e.actor)} · ${esc(e.note || '')}</span></span></li>`).join('')}</ol>
        </section>
      </div>
      <div class="stack-lg">
        <section class="card card-pad">
          <h2>PayPal sandbox</h2>
          <dl class="kv">${idRow('PayPal order', esc(o.paypal_order_id))}${idRow('Authorization', esc(o.authorization_id))}
            ${idRow('Hold expires', when(o.authorization_expires_at), false)}${idRow('Capture', esc(o.capture_id))}
            ${idRow('Captured', o.captured_amount != null ? money(o.captured_amount) : '—', false)}
            ${idRow('Platform fee', o.platform_fee ? money(o.platform_fee) : '—', false)}${idRow('Payment', esc(o.payment_method), false)}
            ${idRow('Tracking', o.tracking_number ? `${esc(o.carrier)} ${esc(o.tracking_number)} · ${esc(o.delivery_status)}` : esc(o.delivery_status), false)}</dl>
          <p class="fine" style="margin-top:10px">Sign in at <a href="https://www.sandbox.paypal.com" target="_blank" rel="noopener">sandbox.paypal.com</a> with the sandbox business account, open Activity, and search these ids.</p>
        </section>
        <section class="card card-pad stack">
          <h2>PayPal API calls (${calls.length})</h2>
          <div class="stack">${calls.map((c) => `<details class="panel" data-key="call-${c.id}" ${openDetails.has('call-' + c.id) ? 'open' : ''}>
            <summary>${esc(c.op)}
              <span class="mono" style="float:right;color:${c.http_status < 300 ? 'var(--success)' : 'var(--alert)'}">${c.http_status}</span>
              <div class="mono meta">${esc(c.request?.method || '')} ${esc(c.request?.path || '')}</div></summary>
            <p class="meta">PayPal-Request-Id: <span class="mono">${esc(c.request_id || '—')}</span></p>${json(c.response)}</details>`).join('') || '<p class="meta">None yet.</p>'}</div>
        </section>
      </div>
    </div>`;

  wire(v);
  const busy = o.state === 'INITIATED' || disputes.some((d) => d.status === 'OPEN' || d.status === 'RUNNING');
  clearTimeout(pollTimer);
  if (busy) pollTimer = setTimeout(load, 2500);
}

function setBusy(btn, label) { if (btn) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = label; btn.classList.add('opacity-60'); } }

function wire(v) {
  document.querySelectorAll('details[data-key]').forEach((d) => d.addEventListener('toggle', () => {
    d.open ? openDetails.add(d.dataset.key) : openDetails.delete(d.dataset.key);
    if (d.open && d.dataset.transcript) loadTranscript(d);
  }));
  document.querySelectorAll('details[data-transcript][open]').forEach(loadTranscript);

  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async () => {
    setBusy(b, b.dataset.act === 'confirm' ? 'Capturing on PayPal…' : 'Working…');
    try { render(await api(`/api/orders/${id}/${b.dataset.act}`, { json: {} })); }
    catch (e) { toast(e.message); load(); }
  }));

  $('#shipForm')?.addEventListener('submit', async (e) => {
    e.preventDefault(); setBusy(e.submitter, 'Saving…');
    try { render(await api(`/api/orders/${id}/ship`, { json: Object.fromEntries(new FormData(e.target)) })); }
    catch (err) { toast(err.message); load(); }
  });

  $('#disputeForm')?.addEventListener('submit', async (e) => {
    e.preventDefault(); setBusy(e.submitter, 'Submitting…');
    try {
      const res = await fetch(`/api/orders/${id}/disputes`, { method: 'POST', body: new FormData(e.target) });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Dispute failed');
      openDetails.delete('dispute');
      load();
    } catch (err) { toast(err.message); load(); }
  });

  $('#humanForm')?.addEventListener('click', async (e) => {
    const decision = e.target.dataset?.decision;
    if (!decision) return;
    e.preventDefault();
    const form = e.currentTarget;
    setBusy(e.target, 'Executing…');
    try {
      await api(`/api/disputes/${form.dataset.dispute}/resolve`, { json: { decision, refund_amount: form.refund_amount.value || undefined } });
      load();
    } catch (err) { toast(err.message); load(); }
  });
}

async function loadTranscript(det) {
  const box = det.querySelector('.tx');
  if (box.dataset.loaded) return;
  try {
    const d = await api(`/api/disputes/${det.dataset.transcript}`);
    box.dataset.loaded = 1;
    box.innerHTML = (d.transcript || []).map((t) => `<div class="tx-step">
      <div class="tx-role">${esc(t.role)}${t.tool ? ` · ${esc(t.tool)}` : ''}</div>
      <div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(typeof t.content === 'string' ? t.content : JSON.stringify(t.content, null, 2))}</div></div>`).join('') || 'No transcript.';
  } catch (e) { box.textContent = e.message; }
}

async function load() {
  try { render(await api(`/api/orders/${id}`)); }
  catch (e) { $('#main').innerHTML = `<p class="callout callout-bad">${esc(e.message)}</p>`; }
}

header();
load();
</script>
</body>
</html>
